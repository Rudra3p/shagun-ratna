  <desc id="desc">Placeholder artwork standing in for a real BIS hallmark stamp photo. Replace via Admin → Site Images.</desc>
  <rect width="800" height="600" fill="#faf3e5"/>
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#C5A059" stroke-width="2" stroke-dasharray="10 8"/>
  <circle cx="400" cy="230" r="90" fill="none" stroke="#90060c" stroke-width="3"/>
