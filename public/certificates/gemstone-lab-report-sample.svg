<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Certified gemstone lab report — sample placeholder</title>
  <desc id="desc">Placeholder artwork standing in for a real gemstone lab certification scan. Replace via Admin → Site Images.</desc>
  <rect width="800" height="600" fill="#faf3e5"/>
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#C5A059" stroke-width="2" stroke-dasharray="10 8"/>
  <rect x="120" y="100" width="560" height="400" fill="#ffffff" stroke="#90060c" stroke-width="1.5"/>
  <text x="400" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#90060c" font-weight="bold" letter-spacing="2">GEMSTONE LAB REPORT</text>
  <line x1="160" y1="172" x2="640" y2="172" stroke="#C5A059" stroke-width="1"/>
  <text x="160" y="210" font-family="Arial, sans-serif" font-size="13" fill="#1a1a1a" opacity="0.7">Stone Type:</text>
  <text x="160" y="238" font-family="Arial, sans-serif" font-size="13" fill="#1a1a1a" opacity="0.7">Clarity:</text>
  <text x="160" y="266" font-family="Arial, sans-serif" font-size="13" fill="#1a1a1a" opacity="0.7">Origin:</text>
  <text x="160" y="294" font-family="Arial, sans-serif" font-size="13" fill="#1a1a1a" opacity="0.7">Report No.:</text>
  <rect x="300" y="197" width="220" height="10" fill="#e5d9c3"/>
  <rect x="300" y="225" width="180" height="10" fill="#e5d9c3"/>
  <rect x="300" y="253" width="200" height="10" fill="#e5d9c3"/>
  <rect x="300" y="281" width="140" height="10" fill="#e5d9c3"/>
  <text x="400" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#1a1a1a">Sample Certificate</text>
  <text x="400" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1a1a1a" opacity="0.65">Placeholder — replace with an actual lab certification scan</text>
  <text x="400" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#90060c" opacity="0.8" letter-spacing="1">gemstone-lab-report-sample.svg</text>
</svg>
